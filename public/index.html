<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnGraph — AI Learning Search Engine</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({startOnLoad: false, theme: 'dark'});</script>
  </head>
  <body>
    <div class="app">
      <header class="search-area">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true"><span></span></div>
          <div>
            <div class="logo">LearnGraph</div>
            <p>AI learning search engine</p>
          </div>
        </div>
        <form class="search-form" id="subjectForm">
          <input
            id="subjectInput"
            name="subject"
            type="search"
            autocomplete="off"
            placeholder="What do you want to learn? Try derivatives, vectors..."
            class="search-bar"
          />
          <button type="submit" class="search-btn">Search</button>
        </form>
        <div class="quick-searches" aria-label="Demo searches">
          <button type="button" data-topic="derivatives">Derivatives</button>
          <button type="button" data-topic="vectors">Vectors</button>
          <button type="button" data-topic="probability">Probability</button>
        </div>
      </header>

      <div class="main">
        <div class="graph-area" id="graphArea">
          <div class="graph-hero">
            <p>Live knowledge map</p>
            <h1>You do not browse a curriculum. You grow one.</h1>
          </div>
          <svg class="graph-edges" id="graphEdges"></svg>
          <div class="graph-nodes" id="graphNodes"></div>
          <div class="graph-empty" id="graphEmpty">
            <p>Type a topic above to start building your knowledge graph</p>
          </div>
        </div>

        <div class="right-panel">
          <div class="agent-feed-section">
            <h3 class="panel-heading">Agent Activity <span id="sourceStats">0 sources</span></h3>
            <div class="agent-feed" id="agentFeed"></div>
          </div>

          <div class="lesson-panel" id="lessonPanel">
            <div class="lesson-empty">
              <p>Click a node in the graph to view its lesson</p>
            </div>
          </div>

          <div class="gallery-panel">
            <h3 class="panel-heading">Lesson Gallery</h3>
            <div class="gallery-grid" id="galleryGrid"></div>
          </div>
        </div>
      </div>

      <div class="status-bar" id="statusBar">
        <span id="graphStats">Graph: 0 nodes · 0 edges</span>
        <span id="pipelineStatus">Ready</span>
      </div>

      <aside class="coach-panel" aria-label="AI coach chat">
        <div class="coach-header">AI Coach</div>
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-form" id="chatForm">
          <input
            id="chatInput"
            type="text"
            autocomplete="off"
            placeholder="Ask for a path, review, or branch..."
          />
          <button type="submit">Send</button>
        </form>
      </aside>
    </div>

    <script src="graph.js"></script>
    <script src="app.js"></script>
  </body>
</html>
