services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          memory: 8G

  learngraph:
    build: .
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen3:8b}
      - GBRAIN_URL=http://gbrain:4100
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - LLM_TIMEOUT_MS=180000
      - MAX_INLINE_LESSONS=${MAX_INLINE_LESSONS:-4}
      - PARALLEL_LESSONS=${PARALLEL_LESSONS:-true}
    depends_on:
      - ollama
      - gbrain

  gbrain:
    image: ghcr.io/nicov7/gbrain:latest
    ports:
      - "4100:4100"
    volumes:
      - gbrain_data:/data
    environment:
      - GBRAIN_PORT=4100
      - GBRAIN_DATA_DIR=/data

volumes:
  ollama_data:
  gbrain_data:
